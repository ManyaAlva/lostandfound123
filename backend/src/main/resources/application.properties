server.port=8080
spring.datasource.url=jdbc:h2:mem:lostfound
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
# Spring Data REST lives under /data, custom controllers under /api
spring.data.rest.base-path=/data
# Externalized configuration (Unit 4): minimum match score in percent
app.match.threshold=15
logging.level.com.campus=INFO
